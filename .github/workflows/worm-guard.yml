name: worm-guard

# Scans every push and every PR for the config-file JS worm, and flags
# commits pushed straight to main/dev/staging without a merged PR.
# Never installs dependencies and never runs repo code: only python3 (stdlib) reading files.

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: worm-guard-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  malware-scan:
    name: Malware scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (no credentials kept)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pick scanner
        # On PRs, prefer the scanner from the base branch so a PR cannot quietly weaken it.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && git cat-file -e "$BASE_SHA:.github/scripts/worm-guard.py" 2>/dev/null; then
            git show "$BASE_SHA:.github/scripts/worm-guard.py" > "$RUNNER_TEMP/worm-guard.py"
            echo "Using worm-guard.py from base branch ($BASE_SHA)"
          else
            cp .github/scripts/worm-guard.py "$RUNNER_TEMP/worm-guard.py"
          fi

      - name: Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          python3 "$RUNNER_TEMP/worm-guard.py" scan
          --event "$EVENT_NAME" --base "$BASE_SHA" --default-branch "$DEFAULT_BRANCH"

  direct-push:
    name: Direct-push check
    if: >-
      github.event_name == 'push' && (
      github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (no credentials kept)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check every pushed commit came from a merged PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
          COMMITS: ${{ join(github.event.commits.*.id, ' ') }}
        run: >-
          python3 .github/scripts/worm-guard.py direct-push
          --repo "$REPO" --actor "$ACTOR" --ref "$REF"
          --before "$BEFORE" --after "$AFTER" --forced "$FORCED" --commits "$COMMITS"
